# The issue fields a repository offers, with the ids a write needs and each
# field's kind, so the panel can say "Effort is a single-select field here"
# rather than just "no Effort field". Separate from the board query on
# purpose: if this fails, editing is off, not the chart.
query RepoFields($owner: String!, $repo: String!) {
  repository(owner: $owner, name: $repo) {
    issueFields(first: 50) {
      nodes {
        __typename
        ... on IssueFieldDate { id name }
        ... on IssueFieldNumber { id name }
        ... on IssueFieldSingleSelect { id name }
        ... on IssueFieldMultiSelect { id name }
        ... on IssueFieldText { id name }
      }
    }
  }
  rateLimit { cost limit remaining resetAt }
}
