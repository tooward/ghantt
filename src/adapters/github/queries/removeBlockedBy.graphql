# Link or unlink "issue is blocked by blockingIssue". Both issues come back,
# so each side's lists (and the chart's arrows) update from GitHub's answer.
mutation RemoveBlockedBy($issueId: ID!, $blockingIssueId: ID!) {
  removeBlockedBy(input: {issueId: $issueId, blockingIssueId: $blockingIssueId}) {
    issue { ...BoardIssue }
    blockingIssue { ...BoardIssue }
  }
}
