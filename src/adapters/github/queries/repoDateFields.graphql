# The date fields a repository offers, with the ids a write needs. Separate
# from the board query on purpose: if this fails, editing is off, not the chart.
query RepoDateFields($owner: String!, $repo: String!) {
  repository(owner: $owner, name: $repo) {
    issueFields(first: 50) {
      nodes {
        __typename
        ... on IssueFieldDate { id name }
      }
    }
  }
  rateLimit { cost limit remaining resetAt }
}
