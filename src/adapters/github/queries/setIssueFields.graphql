# Sets or clears one or more issue fields (Start, End, Days) in a single
# call. Returns the issue as GitHub now holds it. A mutation cannot select
# rateLimit (a root Query field).
mutation SetIssueFields($issueId: ID!, $fields: [IssueFieldCreateOrUpdateInput!]!) {
  setIssueFieldValue(input: {issueId: $issueId, issueFields: $fields}) {
    issue { ...BoardIssue }
  }
}
